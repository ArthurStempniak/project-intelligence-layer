name: FTS5 probe

# Temporário: descobre em qual 22.x o `node:sqlite` embutido passou a trazer
# FTS5. O `engines` do package.json afirmava 22.13, que na verdade falha.
on: [workflow_dispatch, push]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '22.14', '22.15', '22.16', '22.17', '22.18']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: FTS5 disponivel?
        run: |
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync(':memory:');
            try {
              db.exec(\"CREATE VIRTUAL TABLE t USING fts5(a)\");
              console.log(process.version, 'FTS5 OK');
            } catch (e) {
              console.log(process.version, 'FTS5 AUSENTE:', e.message);
              process.exit(1);
            }
          "
